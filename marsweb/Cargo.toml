[package]
name = "metamorphic_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
hyper = "1.0"
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5"
tower-service = "0.3"
tower-http = { version = "0.5", features = ["fs", "set-header"] }
http = "1.0"
libc = "0.2"